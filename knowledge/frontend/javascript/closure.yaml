version: "3.2.0"

concept:
  id: "js-closure"
  name: "JavaScript Closures & Lexical Environment Retention"
  domain: "frontend-javascript"
  source_ids:
    - "ecma-262"
    - "src-mdn-web"

  normative_sources:
    - source_id: "ecma-262"
      name: "ECMAScript Language Specification"
      level: "S0"
      section: "9.1.2 Environment Records & 10.2.1 Function Environment Records"

  claims:
    - id: "lexical-environment-binding"
      source_id: "ecma-262"
      section: "9.1.2"
      claim_text: "A function retains an implicit reference to its outer Environment Record established at evaluation time, forming a closure."
    - id: "independent-environment-instances"
      source_id: "ecma-262"
      section: "10.2.1"
      claim_text: "Every invocation of an outer function allocates a distinct, separate Environment Record."
    - id: "block-iteration-binding"
      source_id: "ecma-262"
      section: "14.7.4.3 ForDeclarationBindingInitialization"
      claim_text: "A for-loop with 'let' creates a fresh lexical Environment Record per iteration, preserving loop counter state per closure."
    - id: "gc-reachability"
      source_id: "ecma-262"
      section: "Memory Management & Garbage Collection"
      claim_text: "Variables in an outer Environment Record cannot be reclaimed by garbage collection as long as any reachable child function references the environment."

  boundary_matrix:
    - dimension: "baseline_behavior"
      applicability: "required"
      reason: "Defines nominal function returning inner function accessing parent variable."
      coverage:
        status: "covered"
        artifact_id: "artifact-closure-baseline"

    - dimension: "multiple_instances"
      applicability: "required"
      reason: "Multiple invocations must produce independent, non-colliding state environments."
      coverage:
        status: "covered"
        artifact_id: "artifact-closure-instances"

    - dimension: "shared_mutable_state"
      applicability: "required"
      reason: "Multiple inner functions from the same invocation share the exact same Environment Record."
      coverage:
        status: "covered"
        artifact_id: "artifact-closure-shared-state"

    - dimension: "loop_variable_binding"
      applicability: "required"
      reason: "Critical pitfall contrasting var (single hoisted binding) vs let (per-iteration lexical scope)."
      coverage:
        status: "covered"
        artifact_id: "artifact-closure-loop-binding"

    - dimension: "memory_retention_gc"
      applicability: "required"
      reason: "Retained lexical environments that hold heavy objects cause production memory leaks."
      coverage:
        status: "covered"
        artifact_id: "artifact-closure-gc-leak"

    - dimension: "prototype_chain"
      applicability: "not_applicable"
      reason: "Closures resolve identifiers along lexical Environment Record scope chains, not prototype inheritance chains."
      coverage:
        status: "not_applicable"
        artifact_id: null

  coverage_artifacts:
    - artifact_id: "artifact-closure-baseline"
      dimension: "baseline_behavior"
      claim_id: "lexical-environment-binding"
      case:
        baseline:
          input: "function outer() { let a = 1; return function() { return a; }; } outer()()"
          expected: 1
      causal_explanation: "The returned function holds an outer reference to outer's Environment Record where 'a' was initialized to 1."
      scaffolding_metaphor: "A child function carrying a backpack of parent variables."

    - artifact_id: "artifact-closure-instances"
      dimension: "multiple_instances"
      claim_id: "independent-environment-instances"
      case:
        baseline:
          input: "function create() { let count = 0; return () => ++count; } const c1 = create(); const c2 = create(); c1(); [c1(), c2()]"
          expected: [2, 1]
      causal_explanation: "Each call to create() instantiates a fresh Environment Record. c1 and c2 mutate distinct memory records."

    - artifact_id: "artifact-closure-shared-state"
      dimension: "shared_mutable_state"
      claim_id: "lexical-environment-binding"
      case:
        baseline:
          input: "function pair() { let x = 0; return [() => ++x, () => x]; } const [inc, get] = pair(); inc(); get()"
          expected: 1
      causal_explanation: "Both inc and get share the identical Environment Record created in the single execution of pair()."

    - artifact_id: "artifact-closure-loop-binding"
      dimension: "loop_variable_binding"
      claim_id: "block-iteration-binding"
      case:
        baseline:
          input: "const fns = []; for (var i = 0; i < 3; i++) { fns.push(() => i); } fns.map(f => f())"
          expected: [3, 3, 3]
        mutation:
          changed_only: "declaration keyword (var -> let)"
          input: "const fns = []; for (let i = 0; i < 3; i++) { fns.push(() => i); } fns.map(f => f())"
          expected: [0, 1, 2]
      causal_explanation: "Under ECMAScript §14.7.4.3, 'let' in for-loop creates a new Environment Record per iteration. 'var' binds a single shared record in the enclosing execution context."

    - artifact_id: "artifact-closure-gc-leak"
      dimension: "memory_retention_gc"
      claim_id: "gc-reachability"
      case:
        baseline:
          input: "let holder; function leak() { const heavy = new Array(1e6); holder = () => heavy.length; } leak(); typeof holder"
          expected: "function"
      causal_explanation: "Global reference 'holder' keeps the inner function reachable, which retains the entire lexical environment containing 'heavy'."

  teaching:
    teaching_budget:
      max_new_dimensions_per_turn: 2
      max_cases_per_cluster: 3
      max_counterexamples: 1
    completed_dimensions:
      - "baseline_behavior"
    active_dimension: "multiple_instances"
    queue:
      - dimension: "multiple_instances"
        priority: "critical"
        phase: 1
      - dimension: "shared_mutable_state"
        priority: "high"
        phase: 2
      - dimension: "loop_variable_binding"
        priority: "critical"
        phase: 2
      - dimension: "memory_retention_gc"
        priority: "high"
        phase: 3

  learner_evidence:
    baseline_behavior:
      status: "independent"
    multiple_instances:
      status: "supported"
    shared_mutable_state:
      status: "not_attempted"
    loop_variable_binding:
      status: "not_attempted"
    memory_retention_gc:
      status: "not_attempted"

  completeness:
    knowledge: 100.0  # 5 covered / 5 required
    teaching: 40.0   # 2 delivered / 5 required
    capability: 20.0 # 1 independent / 5 required
