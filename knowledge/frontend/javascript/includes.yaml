id: "js-array-includes"
name: "Array.prototype.includes & SameValueZero Algorithm"
domain: "frontend-javascript"
source_ids:
  - "src-mdn-web"

core_invariant:
  - "Determines whether an array includes a certain value among its entries, returning true or false, using the SameValueZero comparison algorithm."

coverage_audit:
  target_dimensions:
    - dimension: "primitive_baseline"
      status: "covered"
      test_case: "[1, 2, 3].includes(2)"
      rationale: "Target number primitive 2 exists at index 1."

    - dimension: "value_variation"
      status: "covered"
      test_case: "[1, 2, 3].includes(4)"
      rationale: "Array [1, 2, 3] is unchanged; target number 4 is not present."

    - dimension: "type_mismatch_boundary"
      status: "covered"
      test_case: "[1, 2, 3].includes('2')"
      rationale: "SameValueZero strictly checks types without type coercion (string '2' !== number 2)."

    - dimension: "object_identity_reference"
      status: "covered"
      test_case: "[[1]].includes([1])"
      s0_fact: "ECMAScript §7.2.14 SameValueZero algorithm: distinct object literals produce distinct object values (identities); comparison evaluates to false."
      scaffolding_metaphor: "Distinct memory pointers / separate keycards (for beginner visualization only)."

    - dimension: "special_primitive_nan"
      status: "covered"
      test_case: "[NaN].includes(NaN)"
      s0_fact: "SameValueZero algorithm explicitly treats NaN as equal to NaN (unlike Strict Equality === which treats NaN === NaN as false)."

    - dimension: "special_primitive_signed_zero"
      status: "covered"
      test_case: "[+0].includes(-0)"
      s0_fact: "SameValueZero treats +0 and -0 as equal (unlike Object.is which differentiates them)."

    - dimension: "sparse_array_holes"
      status: "covered"
      test_case: "new Array(1).includes(undefined)"
      s0_fact: "includes() treats sparse empty slots as undefined entries, returning true when searching for undefined."

    - dimension: "index_offset_boundaries"
      status: "covered"
      test_case: "[1, 2, 3].includes(2, 1) vs [1, 2, 3].includes(2, 2)"
      rationale: "Validates positive and negative fromIndex offset handling."

behavioral_space:
  baseline:
    input: "[1, 2, 3].includes(2)"
    expected: true
    rationale: "Target number primitive 2 exists at index 1."

  controlled_variations:
    - step: 1
      variable_changed_only: "Target Search Value Only"
      input: "[1, 2, 3].includes(4)"
      expected: false
      rationale: "Array [1, 2, 3] is unchanged; target number 4 is simply not present in elements."

    - step: 2
      variable_changed_only: "Target Search Type Only (String instead of Number)"
      input: "[1, 2, 3].includes('2')"
      expected: false
      rationale: "Array [1, 2, 3] is unchanged; SameValueZero strictly checks types without type coercion."

    - step: 3
      variable_changed_only: "Array Element Types Only (Elements are now Strings)"
      input: "['1', '2', '3'].includes('2')"
      expected: true
      rationale: "Search value '2' is unchanged from step 2; types now align as string primitives."

    - step: 4
      variable_changed_only: "Reference Structure Only (Nested Array Object Identity)"
      input: "[[1]].includes([1])"
      expected: false
      rationale: "Even though both contain number 1, array literals produce distinct object identities per ECMAScript SameValueZero."
      s0_fact: "ECMAScript §7.2.14 SameValueZero: distinct object instances have distinct identities."
      scaffolding_metaphor: "Distinct memory pointers (for beginner visualization only)."

    - step: 5
      variable_changed_only: "Special Primitive IEEE-754 (NaN vs NaN)"
      input: "[NaN].includes(NaN)"
      expected: true
      rationale: "SameValueZero algorithm explicitly treats NaN as equal to NaN (unlike Strict Equality === which treats NaN === NaN as false)."

    - step: 6
      variable_changed_only: "Special Primitive Signed Zero (+0 vs -0)"
      input: "[+0].includes(-0)"
      expected: true
      rationale: "SameValueZero algorithm treats +0 and -0 as identical values."

  counterexample_shocks:
    - input: "[{ id: 1 }].includes({ id: 1 })"
      expected: false
      shock_reason: "Object literal in search argument creates a new object identity; SameValueZero reference equality fails."
      s0_fact: "ECMAScript §7.2.14: Object comparison evaluates identity, not structural equality."
      scaffolding_metaphor: "Different memory pointers/keycards for two visually identical objects."
      pedagogical_prompt: "The objects look completely identical in fields. Why did includes() return false? What is JavaScript actually comparing under the hood?"

  boundary_cases:
    - input: "[].includes(undefined)"
      expected: false
      boundary_type: "Empty array"
      rationale: "Empty collection has length 0; always returns false."
    - input: "[undefined].includes(undefined)"
      expected: true
      boundary_type: "Explicit undefined element"
      rationale: "Index 0 explicitly contains the undefined primitive."
    - input: "new Array(1).includes(undefined)"
      expected: true
      boundary_type: "Sparse array hole"
      rationale: "includes() treats sparse empty slots as undefined, unlike map() or forEach() which skip holes."
    - input: "[+0].includes(-0)"
      expected: true
      boundary_type: "IEEE-754 Signed zero (+0 vs -0)"
      rationale: "SameValueZero does not differentiate positive and negative zero."

  common_misconceptions:
    - trap: "Believing includes() performs deep property checking on objects."
      counter_proof: "Passing two distinct object references with identical fields returns false."
    - trap: "Assuming includes() behaves identically to indexOf()."
      counter_proof: "indexOf(NaN) returns -1, while includes(NaN) returns true."

  confusing_neighbor_contrast:
    - neighbor: "Array.prototype.indexOf"
      core_difference: "Returns index position integer; uses Strict Equality (===) which causes it to miss NaN."
      when_to_use_which: "Use indexOf when index position is needed; use includes when boolean membership is needed (especially with NaN)."
    - neighbor: "Array.prototype.some"
      core_difference: "Accepts a callback predicate function; essential for finding objects by internal property."
      when_to_use_which: "Use some() when querying objects by property (e.g. users.some(u => u.id === targetId))."
    - neighbor: "Set.prototype.has"
      core_difference: "O(1) average lookup complexity vs O(N) array scan."
      when_to_use_which: "Use Set.has when membership checks are frequent or collections are large."

  real_world_anchors:
    - scenario: "Checking user permissions from JWT payload array."
      trap_in_production: "If roles are returned as [{ name: 'admin' }], roles.includes({ name: 'admin' }) returns false silently."
      correct_pattern: "roles.some(r => r.name === 'admin')"
