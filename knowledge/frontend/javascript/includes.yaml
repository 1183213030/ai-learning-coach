version: "3.2.0"

concept:
  id: "js-array-includes"
  name: "Array.prototype.includes & SameValueZero Algorithm"
  domain: "frontend-javascript"
  source_ids:
    - "ecma-262"
    - "src-mdn-web"

  normative_sources:
    - source_id: "ecma-262"
      name: "ECMAScript Language Specification"
      level: "S0"
      section: "23.1.3.16 Array.prototype.includes"
    - source_id: "ecma-262-svz"
      name: "ECMAScript SameValueZero Specification"
      level: "S0"
      section: "7.2.14 SameValueZero"

  claims:
    - id: "membership-evaluation"
      source_id: "ecma-262"
      section: "23.1.3.16"
      claim_text: "Determines whether an array includes a certain value among its entries, returning true or false, using SameValueZero."
    - id: "same-value-zero-identity"
      source_id: "ecma-262-svz"
      section: "7.2.14"
      claim_text: "If Type(x) is Object, SameValueZero returns true if and only if x and y refer to the exact same Object value (identity)."
    - id: "same-value-zero-nan"
      source_id: "ecma-262-svz"
      section: "7.2.14"
      claim_text: "If Type(x) is Number and both x and y are NaN, SameValueZero returns true."
    - id: "same-value-zero-signed-zero"
      source_id: "ecma-262-svz"
      section: "7.2.14"
      claim_text: "SameValueZero treats +0 and -0 as identical values."

  boundary_matrix:
    - dimension: "primitive_baseline"
      applicability: "required"
      reason: "Defines normal primitive value search baseline under SameValueZero."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-baseline"

    - dimension: "value_variation"
      applicability: "required"
      reason: "Changing target value is central to membership semantics."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-value-var"

    - dimension: "type_mismatch"
      applicability: "required"
      reason: "SameValueZero strictly checks types without coercion (string '2' !== number 2)."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-type-var"

    - dimension: "object_identity"
      applicability: "required"
      reason: "Object operands are compared by reference identity, not structural fields."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-object-identity"

    - dimension: "special_nan"
      applicability: "required"
      reason: "Treating NaN as equal to NaN is the core differentiator from indexOf."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-nan"

    - dimension: "special_signed_zero"
      applicability: "required"
      reason: "SameValueZero treats +0 and -0 as equal (unlike Object.is)."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-signed-zero"

    - dimension: "sparse_structure"
      applicability: "required"
      reason: "includes() treats sparse empty slots as undefined."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-sparse"

    - dimension: "index_offset_boundaries"
      applicability: "required"
      reason: "Validates positive and negative fromIndex offset handling."
      coverage:
        status: "covered"
        artifact_id: "artifact-includes-index-offset"

    - dimension: "prototype_chain"
      applicability: "not_applicable"
      reason: "includes() operates solely on indexed numeric properties without prototype traversal."
      coverage:
        status: "not_applicable"
        artifact_id: null

  coverage_artifacts:
    - artifact_id: "artifact-includes-baseline"
      dimension: "primitive_baseline"
      claim_id: "membership-evaluation"
      case:
        baseline:
          input: "[1, 2, 3].includes(2)"
          expected: true
      causal_explanation: "Target number primitive 2 exists at index 1."

    - artifact_id: "artifact-includes-value-var"
      dimension: "value_variation"
      claim_id: "membership-evaluation"
      case:
        baseline:
          input: "[1, 2, 3].includes(2)"
          expected: true
        mutation:
          changed_only: "target search value"
          input: "[1, 2, 3].includes(4)"
          expected: false
      causal_explanation: "Array is unchanged; target number 4 is not present."

    - artifact_id: "artifact-includes-type-var"
      dimension: "type_mismatch"
      claim_id: "membership-evaluation"
      case:
        baseline:
          input: "[1, 2, 3].includes(2)"
          expected: true
        mutation:
          changed_only: "target search type (number -> string)"
          input: "[1, 2, 3].includes('2')"
          expected: false
      causal_explanation: "SameValueZero strictly checks types without type coercion."

    - artifact_id: "artifact-includes-object-identity"
      dimension: "object_identity"
      claim_id: "same-value-zero-identity"
      case:
        baseline:
          input: "const o = { id: 1 }; [o].includes(o)"
          expected: true
        mutation:
          changed_only: "searchElement allocation reference"
          input: "[{ id: 1 }].includes({ id: 1 })"
          expected: false
      causal_explanation: "Under ECMAScript §7.2.14 SameValueZero, object literals produce distinct Object identities. Reference comparison evaluates to false."
      scaffolding_metaphor: "Distinct memory pointers / separate keycards for identical rooms."

    - artifact_id: "artifact-includes-nan"
      dimension: "special_nan"
      claim_id: "same-value-zero-nan"
      case:
        baseline:
          input: "[NaN].includes(NaN)"
          expected: true
      causal_explanation: "SameValueZero algorithm explicitly treats NaN as equal to NaN."

    - artifact_id: "artifact-includes-signed-zero"
      dimension: "special_signed_zero"
      claim_id: "same-value-zero-signed-zero"
      case:
        baseline:
          input: "[+0].includes(-0)"
          expected: true
      causal_explanation: "SameValueZero algorithm treats +0 and -0 as identical values."

    - artifact_id: "artifact-includes-sparse"
      dimension: "sparse_structure"
      claim_id: "membership-evaluation"
      case:
        baseline:
          input: "new Array(1).includes(undefined)"
          expected: true
      causal_explanation: "includes() treats sparse empty slots as undefined entries."

    - artifact_id: "artifact-includes-index-offset"
      dimension: "index_offset_boundaries"
      claim_id: "membership-evaluation"
      case:
        baseline:
          input: "[1, 2, 3].includes(3, -1)"
          expected: true
      causal_explanation: "Negative offset counts back from array length (3 + (-1) = 2)."

  teaching:
    teaching_budget:
      max_new_dimensions_per_turn: 2
      max_cases_per_cluster: 3
      max_counterexamples: 1
    completed_dimensions:
      - "primitive_baseline"
      - "value_variation"
      - "type_mismatch"
    active_dimension: "object_identity"
    queue:
      - dimension: "object_identity"
        priority: "critical"
        phase: 2
      - dimension: "special_nan"
        priority: "high"
        phase: 2
      - dimension: "special_signed_zero"
        priority: "medium"
        phase: 2
      - dimension: "sparse_structure"
        priority: "low"
        phase: 3

  learner_evidence:
    primitive_baseline:
      status: "independent"
    value_variation:
      status: "independent"
    type_mismatch:
      status: "independent"
    object_identity:
      status: "supported"
    special_nan:
      status: "not_attempted"
    special_signed_zero:
      status: "not_attempted"
    sparse_structure:
      status: "not_attempted"
    index_offset_boundaries:
      status: "not_attempted"

  completeness:
    knowledge: 100.0  # 8 covered / 8 required
    teaching: 50.0   # 4 delivered / 8 required
    capability: 37.5 # 3 independent / 8 required
