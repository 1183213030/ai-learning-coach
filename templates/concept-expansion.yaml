version: "3.1.0"
concept_id: "js-array-includes"
name: "Array.prototype.includes & SameValueZero Algorithm"
domain: "frontend-javascript"

purpose:
  - "Determine whether an array contains a specific element, returning a boolean true or false."

syntax:
  - "arr.includes(searchElement[, fromIndex])"

core_invariant:
  - "Compares searchElement with array elements using the SameValueZero algorithm. Unlike indexOf, it treats NaN as equal to NaN."

coverage_audit:
  target_dimensions:
    - dimension: "primitive_baseline"
      status: "covered"
      test_case: "[1, 2, 3].includes(2)"
    - dimension: "value_variation"
      status: "covered"
      test_case: "[1, 2, 3].includes(4)"
    - dimension: "type_mismatch_boundary"
      status: "covered"
      test_case: "['1'].includes(1)"
    - dimension: "object_identity_reference"
      status: "covered"
      test_case: "[[1]].includes([1])"
      s0_fact: "ECMAScript §7.2.14 SameValueZero algorithm: distinct object literals create distinct object values (identities)."
      scaffolding_metaphor: "Distinct memory pointers (beginner scaffolding only)."
    - dimension: "special_primitive_nan"
      status: "covered"
      test_case: "[NaN].includes(NaN)"
      s0_fact: "SameValueZero treats NaN as equal to NaN."
    - dimension: "special_primitive_signed_zero"
      status: "covered"
      test_case: "[+0].includes(-0)"
      s0_fact: "SameValueZero treats +0 and -0 as equal."
    - dimension: "sparse_array_holes"
      status: "covered"
      test_case: "new Array(1).includes(undefined)"
      s0_fact: "includes() visits empty slots as undefined."
    - dimension: "index_offset_boundaries"
      status: "covered"
      test_case: "[1, 2, 3].includes(3, -1)"

positive_cases:
  - input: "[1, 2, 3].includes(2)"
    expected: true
    rationale: "Direct primitive number match."
  - input: "['admin', 'editor'].includes('admin')"
    expected: true
    rationale: "Direct primitive string match."

variation_cases:
  - input: "[1, 2, 3].includes(2, 1)"
    expected: true
    rationale: "Searching fromIndex 1 includes index 1 itself."
  - input: "[1, 2, 3].includes(1, 1)"
    expected: false
    rationale: "Searching fromIndex 1 starts past the target position."
  - input: "[1, 2, 3].includes(3, -1)"
    expected: true
    rationale: "Negative offset counts back from array length (3 + (-1) = 2)."

counterexample_shocks:
  - input: "['1'].includes(1)"
    expected: false
    shock_reason: "Looks identical in string coercion, but strictly checks types without casting."
  - input: "[[1]].includes([1])"
    expected: false
    shock_reason: "Inner arrays are distinct object identities per ECMAScript SameValueZero."
    s0_fact: "ECMAScript §7.2.14: distinct object literals create separate object identities."
    scaffolding_metaphor: "Distinct memory pointers (for beginner visualization)."
  - input: "[{ id: 1 }].includes({ id: 1 })"
    expected: false
    shock_reason: "Object literal creates a newly allocated object identity; identity comparison fails."
    s0_fact: "ECMAScript §7.2.14: Object comparison evaluates identity, not structural equality."
    scaffolding_metaphor: "Separate keycards for two rooms with identical furniture."

boundary_cases:
  - input: "[NaN].includes(NaN)"
    expected: true
    boundary_type: "IEEE-754 Special Primitive"
    note: "Unlike indexOf which uses === (where NaN === NaN is false), includes correctly finds NaN."
  - input: "[+0].includes(-0)"
    expected: true
    boundary_type: "IEEE-754 Signed Zero"
    note: "SameValueZero treats +0 and -0 as equal (unlike Object.is which differentiates them)."
  - input: "[].includes(undefined)"
    expected: false
    boundary_type: "Empty collection"
  - input: "[undefined].includes(undefined)"
    expected: true
    boundary_type: "Explicit undefined element"
  - input: "new Array(1).includes(undefined)"
    expected: true
    boundary_type: "Sparse array hole"
    note: "includes() treats sparse empty slots as undefined, unlike map() or forEach()."

common_misconceptions:
  - trap: "Believing includes() performs deep object equality checking."
    counter_proof: "Passing two distinct object references with identical fields returns false."
  - trap: "Assuming includes() works like indexOf with NaN."
    counter_proof: "indexOf(NaN) returns -1, while includes(NaN) returns true."

confusing_neighbor_contrast:
  - tool: "Array.prototype.indexOf"
    difference: "Returns integer index; uses Strict Equality (===) which causes it to miss NaN."
  - tool: "Array.prototype.some"
    difference: "Accepts a callback predicate function; essential for finding objects by internal property."
  - tool: "Set.prototype.has"
    difference: "O(1) average lookup complexity; far superior for high-frequency or large collections."

real_world_engineering_anchor:
  scenario: "Checking user permissions from JWT payload array."
  trap_in_prod: "If roles are returned as [{ name: 'admin' }], roles.includes({ name: 'admin' }) returns false silently."
  correct_pattern: "roles.some(r => r.name === 'admin')"
